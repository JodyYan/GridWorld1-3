<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid World</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Grid World</h1>
        
        <div class="controls">
            <label for="grid-size">Enter grid size (between 3 and 10): </label>
            <input type="number" id="grid-size" min="3" max="10" value="5">
            <button id="generate-btn">Generate Grid</button>
        </div>

        <h3 id="grid-title">5 x 5 Grid:</h3>
        
        <div class="grid-wrapper">
            <div class="grid-container" id="policy-grid">
                <!-- Grid generated by JS -->
            </div>
        </div>

        <h3>Value Function:</h3>
        
        <div class="grid-wrapper">
            <div class="grid-container" id="value-grid">
                <!-- Grid generated by JS -->
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
